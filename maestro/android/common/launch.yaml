# Fresh launch (≙ @ResetApp(NEW_SESSION)), then wait for the catalog. After clearState the
# app occasionally never shows a window (the relaunch races the old task's teardown), so
# relaunch if the catalog doesn't appear.
appId: com.saucelabs.mydemoapp.android
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            text: "title"
          timeout: 15000
