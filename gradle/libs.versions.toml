[versions]
kotlin = "2.0.21"
appiumJavaClient = "9.4.0"
seleniumJava = "4.33.0"
junitJupiter = "5.12.2"
junitPlatform = "1.12.2"
assertj = "3.27.3"
typesafeConfig = "1.4.3"
allure = "2.29.1"
slf4j = "2.0.17"
logback = "1.5.18"

[libraries]
appium-java-client = { group = "io.appium", name = "java-client", version.ref = "appiumJavaClient" }
selenium-java = { group = "org.seleniumhq.selenium", name = "selenium-java", version.ref = "seleniumJava" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
typesafe-config = { group = "com.typesafe", name = "config", version.ref = "typesafeConfig" }
allure-junit5 = { group = "io.qameta.allure", name = "allure-junit5", version.ref = "allure" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
