# Activates allure-junit5's AllureJunit5 extension via JUnit 5's ServiceLoader-based
# extension autodetection (see test-support's Allure dependency).
junit.jupiter.extensions.autodetection.enabled=true

# Parallel execution is off by default: running the Android and iOS example tests
# concurrently needs multiple already-booted emulators/simulators, which this framework
# does not provision. See CLAUDE.md for how to opt in once you have multiple devices.
junit.jupiter.execution.parallel.enabled=false
