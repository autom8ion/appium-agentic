name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and run unit tests
        run: ./gradlew build -x :examples:test -x :examples:testAndroid -x :examples:testIos

  android-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Appium server (UiAutomator2 driver)
        run: |
          npm install -g appium@2
          # Pinned: uiautomator2-driver versions after 4.2.4 require Appium 3
          # (peerDependency appium ^3.0.0-rc.2), incompatible with the appium@2
          # server pinned above.
          appium driver install uiautomator2@4.2.4
          appium --log-timestamp --log-level info &
          npx --yes wait-on tcp:4723 --timeout 60000
      - name: Run Android example tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # v1 runs a single API level; add more entries to a matrix here to expand coverage.
          script: ./gradlew :examples:testAndroid -DtestEnv=ci
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: examples/build/allure-results
          if-no-files-found: ignore

  ios-tests:
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Boot iOS Simulator
        # Matches examples/src/test/resources/config/ios/ci.conf's device-name/platform-version.
        # v1 runs a single simulator; expand to a matrix here for broader iOS version coverage.
        run: xcrun simctl boot "iPhone 15" || true
      - name: Start Appium server (XCUITest driver)
        run: |
          npm install -g appium@2
          # Pinned: xcuitest-driver versions after 9.2.5 require Appium 3
          # (peerDependency appium ^3.0.0-rc.2), incompatible with the appium@2
          # server pinned above.
          appium driver install xcuitest@9.2.5
          appium --log-timestamp --log-level info &
          npx --yes wait-on tcp:4723 --timeout 60000
      - name: Run iOS example tests
        run: ./gradlew :examples:testIos -DtestEnv=ci
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: examples/build/allure-results
          if-no-files-found: ignore
